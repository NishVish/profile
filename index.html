<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Repo Explorer</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            padding: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: #333;
            transition: 0.2s;
            border: 1px solid #ddd;
        }

        .card:hover {
            border-color: #2563eb;
            transform: translateY(-3px);
        }

        .folder {
            border-left: 4px solid #f59e0b;
        }

        .file {
            border-left: 4px solid #2563eb;
        }

        .tag {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>Project Explorer</h1>
    <p>Automatically synced with GitHub Repository</p>
    <div id="explorer" class="grid">Loading files...</div>

    <script>
        const REPO_OWNER = 'NishVish';
        const REPO_NAME = 'profile';

        async function fetchRepoContents(path = '') {
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`);
            const items = await response.json();

            const container = document.getElementById('explorer');
            if (path === '') container.innerHTML = ''; // Clear loading text

            items.forEach(item => {
                // Ignore hidden files and the directory tool itself
                if (item.name.startsWith('.') || item.name === 'index.html' || item.name === 'directory.html') return;

                const card = document.createElement('a');
                card.href = item.html_url;
                card.className = `card ${item.type}`;

                card.innerHTML = `
                    <span class="tag">${item.type}</span>
                    <h3 style="margin: 10px 0 5px 0;">${item.name}</h3>
                    <code style="font-size: 11px; color: #888;">${item.path}</code>
                `;

                // If it's a folder, you could optionally make this recursive
                // For now, it links directly to the GitHub folder view
                container.appendChild(card);
            });
        }

        fetchRepoContents();
    </script>
</body>

</html>
